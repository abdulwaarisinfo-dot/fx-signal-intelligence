services:
  - type: worker
    name: flintel-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python flintel_service.py
    envVars:

      # ── Databases ─────────────────────────────
      # MongoDB: signals + jobs/status
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: flintel_bot
      - key: MONGODB1_URI
        sync: false
      - key: MONGODB1_DB
        value: flintel_bot
      - key: MONGODB_DATA
        value: "true"

      # MySQL sink
      - key: MYSQL_DATA
        value: "true"
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: flintel

      # ── Embeddings (OpenAI) ───────────────────
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBEDDING_ENABLED
        value: "true"
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small

      # ── Reddit (RapidAPI reddit34) ────────────
      - key: REDDIT_ENABLED
        value: "true"
      - key: REDDIT_SOURCE
        value: rapidapi
      - key: REDDIT_API_KEY
        sync: false
      # getPopularPosts?sort=new returns "data not found" now; this endpoint works
      - key: REDDIT_API_ENDPOINT
        value: getBestPopularPosts
      - key: REDDIT_API_SORT
        value: none
      # one-time backfill of the last N hours on startup (0 = off)
      - key: REDDIT_API_BACKFILL_HOURS
        value: "48"
      - key: REDDIT_POLL_INTERVAL_SECONDS
        value: "30"
      - key: REDDIT_USER_AGENT
        value: FlintelSignalBot/6.0
      # optional, only if Reddit blocks (429/403): http://user:pass@host:port
      - key: REDDIT_PROXY
        sync: false

      # ── Twitter / X (RapidAPI) ────────────────
      - key: TWITTER_ENABLED
        value: "true"
      - key: RAPID_API_KEY
        sync: false
      - key: TWITTER_RESULTS_PER_QUERY
        value: "50"

      # ── Hacker News ───────────────────────────
      - key: HACKERNEWS_ENABLED
        value: "false"

      # ── Worker settings ───────────────────────
      - key: WORKER_CONCURRENCY
        value: "20"
      - key: LOOKBACK_DAYS
        value: "180"
