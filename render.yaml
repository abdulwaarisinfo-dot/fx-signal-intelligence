services:
  - type: worker
    name: flintel-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python flintel_service.py
    envVars:

      # ── Databases ─────────────────────────────
      # MongoDB: signals + jobs/status
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: flintel_bot
      - key: MONGODB1_URI
        sync: false
      - key: MONGODB1_DB
        value: flintel_bot
      - key: MONGODB_DATA
        value: "true"

      # MySQL sink
      - key: MYSQL_DATA
        value: "true"
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: flintel

      # ── Embeddings (OpenAI) ───────────────────
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBEDDING_ENABLED
        value: "true"
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small

      # ── Reddit (RapidAPI reddit34) ────────────
      # RSS is being shut down by Reddit on 13 Nov 2026 and already returns
      # 429/403. The source is now the reddit34 RapidAPI (own key, separate
      # from the Twitter RAPID_API_KEY). Set REDDIT_SOURCE=rss to go back.
      - key: REDDIT_ENABLED
        value: "true"
      - key: REDDIT_SOURCE
        value: rapidapi
      - key: REDDIT_API_KEY
        sync: false
      - key: REDDIT_POLL_INTERVAL_SECONDS
        value: "30"
      # only used when REDDIT_SOURCE=rss:
      - key: REDDIT_USER_AGENT
        value: flintel-fetch/1.0 (+https://github.com/abdulwaarisinfo-dot/fx-signal-intelligence)
      - key: REDDIT_PROXY
        sync: false

      # ── Twitter / X (RapidAPI) ────────────────
      - key: TWITTER_ENABLED
        value: "true"
      - key: RAPID_API_KEY
        sync: false
      - key: TWITTER_RESULTS_PER_QUERY
        value: "50"

      # ── Hacker News ───────────────────────────
      - key: HACKERNEWS_ENABLED
        value: "false"

      # ── Worker settings ───────────────────────
      - key: WORKER_CONCURRENCY
        value: "20"
      - key: LOOKBACK_DAYS
        value: "180"
